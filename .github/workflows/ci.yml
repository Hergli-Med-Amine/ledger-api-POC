name: CI

# docs/openapi.json is not ignored: a test checks it against the code.
on:
  push:
    branches: [main, develop]
    paths-ignore: ["**.md", "docs/adr/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/adr/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install uv==0.13.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  compose-smoke:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --build
      - run: curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8000/health
      - if: failure()
        run: docker compose logs
