name: CD

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/adr/**"]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Skipped until the GCP repository variables exist (see README, "Deploy").
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ledger-api/ledger-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Build and push image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Migrations run before the new code serves traffic, so they must stay backward compatible.
      - name: Migrate database
        run: |
          gcloud run jobs update ledger-migrate --image "$IMAGE" --region "$REGION"
          gcloud run jobs execute ledger-migrate --region "$REGION" --wait

      - name: Deploy API and outbox job
        run: |
          gcloud run services update ledger-api --image "$IMAGE" --region "$REGION"
          gcloud run jobs update ledger-outbox --image "$IMAGE" --region "$REGION"

      - name: Smoke test
        run: |
          url=$(gcloud run services describe ledger-api --region "$REGION" --format 'value(status.url)')
          curl --fail --retry 5 --retry-all-errors "$url/health"
          status=$(curl -s -o /dev/null -w '%{http_code}' "$url/v1/wallets")
          test "$status" = 401
